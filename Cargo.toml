[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
description = "Process and resource monitor for Linux"
authors = ["Mykhailo Makarov"]
license = "GPL-3.0-or-later"
repository = "https://github.com/makarov-mm/pulse-linux"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
async-channel = "2.5.0"
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
libc = "0.2.191"
pangocairo = "0.22.9"
rustix = { version = "1.1.6", features = ["process", "param"] }

[profile.release]
lto = "thin"
strip = true
